[package]
name = "quickjs-pure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# 相对本 crate 目录；继承 workspace 的 "README.md" 会被解析成
# ../../README.md（包外路径），cargo 因此警告 readme 指向包外。
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Embeddable JavaScript engine written in pure Rust (QuickJS-compatible)"

# crates.io 上的 `quickjs` 已被一个 2019 年的 FFI 包装占用，因此包名加 `-pure`
# 后缀；lib 名保持 `quickjs`，使用者写 `use quickjs::…`。
[lib]
name = "quickjs"

[dependencies]
quickjs-gc.workspace = true
quickjs-parse.workspace = true
quickjs-compile.workspace = true
quickjs-regexp.workspace = true
