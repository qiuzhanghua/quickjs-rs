[package]
name = "quickjs-compile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# 相对本 crate 目录；继承 workspace 的 "README.md" 会被解析成
# ../../README.md（包外路径），cargo 因此警告 readme 指向包外。
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Bytecode compiler for the pure-Rust QuickJS port"

# lib 名保持 `js_compile`；见 quickjs-gc 的说明。
[lib]
name = "js_compile"

[dependencies]
quickjs-parse.workspace = true

[dev-dependencies]
# 差分 harness 只用于本地测试，不上传，因此不加版本约束。
quickjs-conformance = { path = "../quickjs-conformance" }
