[workspace]
resolver = "3"
members = [
    "crates/quickjs-gc",
    "crates/quickjs-parse",
    "crates/quickjs-regexp",
    "crates/quickjs-compile",
    "crates/quickjs-pure",
    "crates/quickjs-cli",
    "crates/quickjs-conformance",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/qiuzhanghua/quickjs-rs"
# 每个 crate 自己声明 readme：相对 crate 目录，指向它自己的 README.md。
keywords = ["javascript", "quickjs", "ecmascript", "interpreter"]
categories = ["development-tools"]
# 路径相对仓库根解析，因此每个 crate 的包里都带同一份 README。

[workspace.dependencies]
# 内部 crate 同时写 path 与 version：path 供本地构建，version 供发布解析
# （`cargo publish` 会把 path 去掉，只留版本约束）。
#
# version 写宽版本 "0.5" 而不是精确的 "0.5.0"，这样 patch 升级只需改
# 上面 `workspace.package.version` 一处；抬 minor 时这里必须同步。
#
# 同步不是可选的：`^0.2` 解析不到 0.3.0，而 `quickjs-compile` 用到了比已发布的
# `quickjs-parse 0.2.0` 更新的 API，抬 minor 却漏改这里，`scripts/publish.sh` 的
# dry-run 就会拉回旧 parse 去编译新 compile，报一堆"方法不存在"。
quickjs-gc = { path = "crates/quickjs-gc", version = "0.5" }
quickjs-parse = { path = "crates/quickjs-parse", version = "0.5" }
quickjs-regexp = { path = "crates/quickjs-regexp", version = "0.5" }
quickjs-compile = { path = "crates/quickjs-compile", version = "0.5" }
quickjs-pure = { path = "crates/quickjs-pure", version = "0.5" }
# 仅 dev 使用，不上传，因此不需要版本约束。
quickjs-conformance = { path = "crates/quickjs-conformance" }
